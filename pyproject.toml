[tool.poetry]
name = "finalproject-polyakov-m25-555"
version = "0.1.0"
description = "Консольное приложение для работы с валютным кошельком"
authors = ["Polyakovoa <polyakovoa@mail.ru>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "valutatrade_hub", from = "." }
]

[tool.poetry.dependencies]
python = "^3.8"
prettytable = "^3.9.0"
toml = "^0.10.2"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.0"

[tool.poetry.scripts]
valutatrade = "main:main"

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "W",  # pycodestyle warnings
]
ignore = []

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.valutatrade]
data_dir = "data"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_dir = "logs"
log_level = "INFO"
log_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
session_timeout_hours = 24
max_login_attempts = 3
api_timeout_seconds = 30

# Parser Service settings
exchangerate_api_key = "4b468e05030488a5d11e381c"
coingecko_api_key = ""
rates_update_interval = 300
api_max_retries = 3
api_retry_delay = 1.0